# Azure DevOps pipeline: backend (deploy the Function App only).
#
# Database schema/data lifecycle (Migrate, Seed) moved back to GitHub Actions
# (.github/workflows/migrate-database.yml, seed-database.yml), chained the way they
# were before this pipeline existed: terraform-azure apply -> migrate-database ->
# seed-database, via workflow_run triggers. Keeping Migrate/Seed together in one
# system avoids two systems (GitHub Actions and DevOps) both being able to write to
# mob-training-db independently, and Azure DevOps's Microsoft-hosted agents were
# adding provisioning/queue overhead that GitHub-hosted runners don't. This pipeline
# now owns exactly one thing: shipping api/ to mob-functions-dev once GitHub Actions
# has already brought the database schema/data up to date.
#
# ONE-TIME SETUP REQUIRED IN THE DEVOPS PROJECT, before this pipeline can run:
#   1. Project Settings -> Service connections -> New Azure Resource Manager
#      connection (workload identity federation, matching how GitHub Actions'
#      azure/login@v2 authenticates). Name it to match `azureSubscription` below,
#      or change that value to whatever you name it. It needs Contributor (or
#      Website Contributor) on mob-functions-dev -- it no longer needs SQL admin
#      login or Key Vault read, since this pipeline doesn't touch the database.
#
# Trigger: push to main, paths under api/ or src/. Independent of GitHub Actions'
# migrate-database/seed-database chain -- if you change db/migrations or db/seed
# AND api/ in the same push, let the GitHub Actions chain finish (Actions tab)
# before trusting a deploy that ran in parallel with it.
#
# src/* is included because the build step below vendors src/quizgen into
# api/quizgen (rm -rf api/quizgen && cp -r src/quizgen api/quizgen) -- a
# src/-only change (e.g. src/quizgen/validators.py, src/quizgen/pipeline.py)
# changes what actually deploys just as much as an api/-only change does, but
# without this path being watched it silently never triggered a deploy. Found
# by hand three separate times before this: had to manually `az pipelines run`
# for changes that only touched src/quizgen.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - api/*
      - src/*
      - azure-pipelines-backend.yml

# Azure Pipelines' default, if this is omitted, is to ALSO run on every pull request
# regardless of what files it touches -- not just pushes to main like the header
# comment above describes. Without this, opening any PR against this repo silently
# redeploys mob-functions-dev before merge, which is how PR #12 (the very fix for
# this pipeline) ended up triggering a live run of itself. Explicit opt-out, not an
# oversight.
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: azureSubscription
    value: 'mob-azure-connection'   # <- rename to match your service connection
  - name: functionAppName
    value: 'mob-functions-dev'

stages:
  # ---------------------------------------------------------------------------
  - stage: DeployBackend
  # ---------------------------------------------------------------------------
    jobs:
      - job: DeployFunctionApp
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'

          - bash: |
              set -euo pipefail
              # Vendored, not installed as a shared package: /documents, /roles and
              # /jobs/{id} need pipeline.py, rolemap.py and ingest.py, and api/ cannot
              # import src/ directly (it is a flat Functions package deployed on its
              # own -- see function_app.py's module docstring). Copying at build time
              # from the one source of truth means there is nothing to keep in sync by
              # hand and nothing committed to drift, unlike api/shared/qscore.py's
              # defended-copy approach -- this runs fresh every deploy.
              #
              # bank.py comes along too and is unused; SqlBank replaces it for this
              # deploy. Harmless: sqlite3 is stdlib, so importing bank.py costs nothing
              # even though nothing here calls it.
              rm -rf api/quizgen
              cp -r src/quizgen api/quizgen

              python -m pip install --upgrade pip
              # --platform/--python-version/--implementation/--only-binary force pip to
              # fetch wheels built for Azure's actual Linux Python 3.11 runtime,
              # regardless of what this agent's own OS happens to be. pyodbc and bcrypt
              # both have compiled C extensions -- without pinning the target platform,
              # pip picks whatever wheel matches THIS agent, which can silently fail to
              # load once actually running inside the Function App container: the host
              # comes up, function_app.py never finishes importing, and every route
              # 404s with no error surfaced anywhere in this pipeline.
              python -m pip install \
                --target api/.python_packages/lib/site-packages \
                --platform manylinux2014_x86_64 --only-binary=:all: \
                --python-version 3.11 --implementation cp \
                -r api/requirements.txt
              python -m compileall -q api
              PYTHONPATH="api:api/.python_packages/lib/site-packages" python -c "
              import function_app
              print('Registered routes:', len(function_app.app.get_functions()))
              # Confirms the vendor copy and its dependencies actually import, not just
              # that function_app.py parses -- every quizgen import in function_app.py
              # is lazy (inside route handlers), so importing function_app alone would
              # not have caught a missing or broken vendor copy until the first real
              # upload hit it in production.
              import quizgen.pipeline, quizgen.rolemap, quizgen.ingest
              print('quizgen vendored and importable.')
              "
            displayName: 'Build function package'

          - task: ArchiveFiles@2
            displayName: 'Zip package'
            inputs:
              rootFolderOrFile: 'api'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/api.zip'

          # Published BEFORE the deploy step, deliberately: if the deploy or health
          # check fails, the exact package that was about to ship (or just did) is
          # still downloadable from this run for inspection -- e.g. to check whether
          # a dependency actually built, without needing Azure Portal/CLI access.
          - task: PublishPipelineArtifact@1
            displayName: 'Publish artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/api.zip'
              artifact: 'api-package-$(Build.BuildId)'

          - task: AzureFunctionApp@2
            displayName: 'Deploy to the Function App'
            inputs:
              azureSubscription: $(azureSubscription)
              appType: 'functionAppLinux'
              appName: $(functionAppName)
              package: '$(Build.ArtifactStagingDirectory)/api.zip'
              runtimeStack: 'PYTHON|3.11'
              deploymentMethod: 'zipDeploy'

          - bash: sleep 45
            displayName: 'Wait for app'

          - bash: |
              URL="https://$(functionAppName).azurewebsites.net/api/health"
              echo "GET $URL"
              for attempt in 1 2 3 4 5; do
                CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$URL" || echo "000")
                if [ "$CODE" = "200" ]; then
                  echo "Healthy."
                  cat /tmp/health.json
                  exit 0
                fi
                if [ "$CODE" = "404" ]; then
                  echo "##vso[task.logissue type=error]The Function host is reachable but no /api/health route is registered. Check the deployed zip and Python worker import logs."
                fi
                echo "Attempt $attempt: HTTP $CODE — retrying in 15s"
                sleep 15
              done
              echo "##vso[task.logissue type=error]Health check failed after 5 attempts (last HTTP $CODE)."
              cat /tmp/health.json 2>/dev/null || true
              exit 1
            displayName: 'Health check'
