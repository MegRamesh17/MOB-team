# SUPERSEDED by azure-pipelines-backend.yml's Migrate stage in Azure DevOps.
# workflow_dispatch-only now (the automatic workflow_run trigger off terraform-azure
# is removed) so this can no longer fire on its own and race the DevOps pipeline for
# the same database. Kept only for manual emergency use -- e.g. DevOps is down and
# someone needs to apply a migration by hand.
name: migrate-database

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Get runner IP
        id: ip
        run: echo "ip=$(curl -s https://api.ipify.org)" >> "$GITHUB_OUTPUT"
      - name: Open temporary firewall rule
        run: |
          az sql server firewall-rule create \
            --resource-group MOB --server mob-sql-server-02 \
            --name github-actions-temp \
            --start-ip-address ${{ steps.ip.outputs.ip }} \
            --end-ip-address ${{ steps.ip.outputs.ip }}
      - name: Install sqlcmd
        run: |
          sudo apt-get update
          sudo apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
      - name: Ensure migration tracking table exists
        run: |
          sqlcmd -S mob-sql-server-02.database.windows.net -d mob-training-db \
            -U mobsqladmin -P "${{ secrets.SQL_ADMIN_PASSWORD }}" -C -b -Q "
            IF OBJECT_ID('dbo.SchemaMigrations') IS NULL
            CREATE TABLE dbo.SchemaMigrations (
              filename NVARCHAR(255) PRIMARY KEY,
              applied_at DATETIME2 NOT NULL DEFAULT SYSUTCDATETIME()
            );"
      - name: Run only new migrations
        run: |
          set -euo pipefail
          for file in db/migrations/*.sql; do
            fname=$(basename "$file")
            already_applied=$(sqlcmd -S mob-sql-server-02.database.windows.net -d mob-training-db \
              -U mobsqladmin -P "${{ secrets.SQL_ADMIN_PASSWORD }}" -C -h -1 \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.SchemaMigrations WHERE filename = '$fname'" | tr -d '[:space:]')
            if [ "$already_applied" = "0" ]; then
              echo "Applying $fname"
              # Explicit exit-code check, not just `set -e`: this is the line that
              # decides whether $fname gets recorded as applied. A migration that
              # fails partway must never reach the INSERT below, or SchemaMigrations
              # ends up lying about what's actually in the database -- which is
              # exactly how 009 and 011 went missing while marked "applied".
              if ! sqlcmd -S mob-sql-server-02.database.windows.net -d mob-training-db \
                -U mobsqladmin -P "${{ secrets.SQL_ADMIN_PASSWORD }}" -C -b -i "$file"; then
                echo "::error file=$file::Migration failed -- NOT recording it as applied. Fix the migration (or repair the database) and re-run this job."
                exit 1
              fi
              sqlcmd -S mob-sql-server-02.database.windows.net -d mob-training-db \
                -U mobsqladmin -P "${{ secrets.SQL_ADMIN_PASSWORD }}" -C -b \
                -Q "INSERT INTO dbo.SchemaMigrations (filename) VALUES ('$fname')"
            else
              echo "Skipping $fname - already applied"
            fi
          done
      - name: Close temporary firewall rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group MOB --server mob-sql-server-02 \
            --name github-actions-temp
